{% macro formField(id, label, type='text', value='') %}
<div class="form-floating mb-3">
  <input
    class="form-control"
    id="{{ id }}"
    name="{{ id }}"
    type="{{ type }}"
    placeholder="{{ label }}"
    value="{{ value }}"
    required
  />
  <label for="{{ id }}">{{ label }}</label>
</div>
{% endmacro %}
